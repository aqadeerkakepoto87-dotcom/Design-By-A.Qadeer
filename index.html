<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Practice · Professional Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 2rem 1rem 2rem 1rem;
            color: #1e293b;
            line-height: 1.5;
            position: relative;
        }

        /* Watermark / Designer credit */
        .watermark {
            position: fixed;
            bottom: 18px;
            right: 24px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(6px);
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #0d2f52;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.08);
            border: 1px solid #d9e4f0;
            z-index: 999;
            letter-spacing: 0.3px;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .watermark i {
            color: #1e9b4b;
            font-size: 0.9rem;
        }

        .watermark strong {
            font-weight: 700;
            color: #0a2a4a;
            margin-left: 2px;
        }

        .watermark a {
            text-decoration: none;
            color: inherit;
        }

        .watermark:hover {
            background: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 30, 60, 0.12);
        }

        .quiz-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0f2b5c, #1e4a8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            color: #475569;
            background: #ffffffd9;
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .section-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            padding: 1.8rem 2rem;
            margin-bottom: 2.5rem;
            transition: box-shadow 0.2s;
            border: 1px solid #e9eef4;
            position: relative;
        }

        .section-card:hover {
            box-shadow: 0 20px 30px -10px rgba(0, 35, 70, 0.08);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #dbe7f5;
            color: #0a2a4a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #2a6eb0;
            font-size: 1.4rem;
        }

        .question-item {
            margin-bottom: 1.8rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid #edf2f9;
        }

        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 1rem;
            color: #0f2b4b;
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
        }

        .q-num {
            background: #e2eaf5;
            color: #1a4c8c;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            min-width: 38px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-left: 3.2rem;
        }

        @media (max-width: 650px) {
            .options-grid {
                grid-template-columns: 1fr;
                margin-left: 0;
            }
            .section-card {
                padding: 1.4rem;
            }
            .question-text {
                font-size: 1rem;
            }
            .watermark {
                bottom: 12px;
                right: 12px;
                font-size: 0.75rem;
                padding: 0.35rem 1rem;
            }
        }

        .option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #f9fcff;
            border: 1.5px solid #d9e4f0;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1e3a5f;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
        }

        .option:hover {
            background: #eef5ff;
            border-color: #a8c4e0;
            transform: translateY(-1px);
        }

        .option .letter {
            font-weight: 700;
            color: #1f5d9e;
            background: #e1ecfa;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option.selected-correct {
            background: #e2f7e9;
            border-color: #1e9b4b;
            color: #0a4b23;
            box-shadow: 0 2px 8px rgba(30, 155, 75, 0.15);
        }

        .option.selected-correct .letter {
            background: #1e9b4b;
            color: white;
        }

        .option.selected-incorrect {
            background: #fce9e9;
            border-color: #c73535;
            color: #7a1a1a;
            box-shadow: 0 2px 8px rgba(199, 53, 53, 0.12);
        }

        .option.selected-incorrect .letter {
            background: #c73535;
            color: white;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.95;
            cursor: default;
        }

        .footer-note {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #64748b;
            padding: 1.2rem;
            background: #ffffffc7;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid #e2eaf5;
        }

        .footer-note i {
            color: #2a6eb0;
            margin-right: 6px;
        }

        /* subtle watermark on each section (optional) */
        .section-card::after {
            content: "A.Qadeer";
            position: absolute;
            bottom: 10px;
            right: 18px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #b8c9dd;
            opacity: 0.55;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Watermark / Designer credit (fixed bottom-right) -->
    <div class="watermark">
        <i class="fas fa-pen-fancy"></i>
        <span>Design by <strong>A.Qadeer</strong></span>
    </div>

    <div class="quiz-container">
        <div class="header">
            <h1>MCQ Practice Test</h1>
            <p><i class="fas fa-check-circle" style="color: #1e9b4b; margin-right: 6px;"></i> Select an answer – green means correct, red means incorrect</p>
        </div>

        <!-- Sections injected by JavaScript -->
        <div id="quiz-root"></div>

        <div class="footer-note">
            <i class="fas fa-lightbulb"></i> Click any option to instantly check correctness. Correct fills green, incorrect fills red.
        </div>
    </div>

    <script>

                        { q: "A random variable is best described as:", options: ["An event that always occurs", "A numerical value assigned to each outcome of a random experiment", "A fixed constant only", "A sample space without outcomes"], correct: 1 },
                        { q: "A fair coin is tossed twice. Let X be the number of heads. The probability P(X=1) is:", options: ["1/4", "1/2", "3/4", "1"], correct: 1 },
                        { q: "A random variable X has the distribution: X:0,1,2 with P(X):0.2,0.5,0.3. The expected value E(X) is:", options: ["0.8", "1.0", "1.1", "1.3"], correct: 2 },
                        { q: "For a fair six-sided die, let X be the number obtained. The expected value E(X) is:", options: ["3", "3.5", "4", "4.5"], correct: 1 },
                        { q: "Which condition must hold for a discrete probability distribution?", options: ["Every probability is greater than 1", "The sum of all probabilities is 0", "Every probability lies between 0 and 1, and their sum is 1", "All outcomes must have equal probabilities"], correct: 2 },
                        { q: "A binomial experiment has n=5 independent trials and success probability p=0.2. The probability of exactly one success is:", options: ["0.08192", "0.2048", "0.4096", "0.67232"], correct: 2 },
                        { q: "For a binomial random variable with n=20 and p=0.3, its mean is:", options: ["3", "5", "6", "14"], correct: 2 },
                        { q: "For a binomial random variable with n=10 and p=0.4, its variance is:", options: ["2.4", "4.0", "6.0", "10.0"], correct: 0 },
                        { q: "A random variable has E(X)=4 and E(X²)=22. Its variance is:", options: ["4", "6", "12", "18"], correct: 1 },
                        { q: "The number of defects in a concrete sample is modeled by a Poisson distribution with parameter λ=2. The probability of zero defects is:", options: ["2e⁻²", "e⁻²", "1−e⁻²", "e⁻¹"], correct: 1 }
                    ]
                }
            ];

            // ------------------------------------------------------------
            // 2. RENDER the quiz
            // ------------------------------------------------------------
            const root = document.getElementById('quiz-root');
            let globalQuestionCounter = 1;

            sections.forEach((section, secIndex) => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section-card';

                const titleEl = document.createElement('div');
                titleEl.className = 'section-title';
                titleEl.innerHTML = `<i class="fas fa-layer-group"></i> ${section.title}`;
                sectionEl.appendChild(titleEl);

                section.questions.forEach((qData, qIndex) => {
                    const qNum = globalQuestionCounter++;
                    const qItem = document.createElement('div');
                    qItem.className = 'question-item';

                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.innerHTML = `<span class="q-num">Q${qNum}</span> ${qData.q}`;
                    qItem.appendChild(qText);

                    const optionsGrid = document.createElement('div');
                    optionsGrid.className = 'options-grid';

                    const correctIndex = qData.correct;

                    qData.options.forEach((optText, optIndex) => {
                        const optDiv = document.createElement('div');
                        optDiv.className = 'option';
                        const letter = String.fromCharCode(65 + optIndex);
                        optDiv.innerHTML = `<span class="letter">${letter}</span> <span>${optText}</span>`;
                        optDiv.dataset.optionIndex = optIndex;

                        optDiv.addEventListener('click', function(e) {
                            const parentGrid = this.parentElement;
                            if (parentGrid.querySelector('.disabled')) return;

                            const chosenIdx = parseInt(this.dataset.optionIndex);
                            const isCorrect = (chosenIdx === correctIndex);

                            const allOptions = parentGrid.querySelectorAll('.option');
                            allOptions.forEach(opt => {
                                opt.classList.add('disabled');
                                opt.style.pointerEvents = 'none';
                            });

                            if (isCorrect) {
                                this.classList.add('selected-correct');
                            } else {
                                this.classList.add('selected-incorrect');
                                // Highlight the correct answer in green for learning
                                allOptions.forEach(opt => {
                                    const idx = parseInt(opt.dataset.optionIndex);
                                    if (idx === correctIndex && !opt.classList.contains('selected-correct')) {
                                        opt.classList.add('selected-correct');
                                        opt.style.opacity = '0.85';
                                    }
                                });
                            }
                        });

                        optionsGrid.appendChild(optDiv);
                    });

                    qItem.appendChild(optionsGrid);
                    sectionEl.appendChild(qItem);
                });

                root.appendChild(sectionEl);
            });
        })();
    </script>
</body>
</html>
